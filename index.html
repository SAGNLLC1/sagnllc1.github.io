<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAGN LLC — Government Procurement & Supply Chain Solutions</title>
<meta name="description" content="SAGN LLC is an SBA-certified woman-owned small business (WOSB) and government supplier in Florida. CAGE 125K5 | UEI KMFNA8MUCQ69. Industrial equipment sourcing, janitorial and office supplies, and procurement support for federal, state, and local agencies.">
<link rel="canonical" href="https://sagnllc1.github.io/">
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
<link rel="stylesheet" href="./styles.css?v=33">
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="./Icons.jsx?v=11"></script>
<script type="text/babel" src="./Nav.jsx?v=11"></script>
<script type="text/babel" src="./Hero.jsx?v=18"></script>
<script type="text/babel" src="./Section.jsx?v=11"></script>
<script type="text/babel" src="./Cards.jsx?v=11"></script>
<script type="text/babel" src="./Contact.jsx?v=29"></script>
<script type="text/babel" src="./Footer.jsx?v=32"></script>

<script type="text/babel">
const { useState, useEffect } = React;
const CAPSTAT_URL = "./SAGN_LLC_Capability_Statement.pdf";

function App(){
  const [active, setActive] = useState("hero");
  useEffect(() => {
    const ids = ["hero","about","services","differentiators","past-performance","company-data","contact"];
    const onScroll = () => {
      const y = window.scrollY + 120;
      let cur = "hero";
      for (const id of ids){ const el = document.getElementById(id); if (el && el.offsetTop <= y) cur = id; }
      setActive(cur);
    };
    window.addEventListener("scroll", onScroll, { passive:true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  const scrollTo = (id) => { const el = document.getElementById(id); if (el) window.scrollTo({ top: el.offsetTop - 60, behavior:"smooth" }); };
  const toast = (msg) => { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); };

  const services = [
    { icon:<IconCog/>, title:"Industrial Equipment Sourcing & Procurement Support", body:"Sourcing and delivery of industrial equipment, machinery, safety supplies, and facility maintenance materials through a reliable supplier network.", naics:"NAICS 423840" },
    { icon:<IconTrash/>, title:"Cleaning Equipment & Janitorial Supplies", body:"Sourcing and delivery of janitorial products, cleaning supplies, sanitation materials, and service establishment equipment for government facilities. Supply fulfillment only; cleaning services are not performed.", naics:"NAICS 423850" },
    { icon:<IconFile/>, title:"Office Supplies & Paper Products", body:"Sourcing and delivery of office supplies, paper products, breakroom essentials, and general-use business supplies, with fast turnaround on quotes and competitive government pricing.", naics:"NAICS 424120" },
  ];
  const process = [
    { t:"Vendor sourcing & quotes", d:"Vendor identification, price comparison, and fast, compliant RFQ responses." },
    { t:"TAA & Berry Amendment compliance", d:"Verified on every quote, with country-of-origin documentation." },
    { t:"Purchase order processing", d:"End-to-end documentation with audit-ready records." },
    { t:"Any order size", d:"GPC and micro-purchases through large multi-line orders." },
  ];
  const diffs = [
    { num:"01", title:"Owner-Operated Accountability", body:"Direct accountability on every order, every time. With no staff rotation or handoffs, agencies always know who is responsible." },
    { num:"02", title:"Rapid Turnaround", body:"With no layers of management slowing response time, SAGN LLC returns quotes quickly and processes purchase orders without delay." },
    { num:"03", title:"Local Florida Presence", body:"SAGN LLC holds a Miami-Dade County Local Business Tax Receipt and is committed to building long-term agency relationships in South Florida." },
    { num:"04", title:"Women-Owned Small Business", body:"SBA WOSB certified and positioned to support woman-owned set-aside eligibility and supplier diversity goals." },
  ];

  return (<>
    <Nav active={active} onNavigate={scrollTo} />
    <Hero
      onPrimary={() => { window.open(CAPSTAT_URL, "_blank"); toast("Opening Capability Statement…"); }}
      onSecondary={() => scrollTo("contact")} />

    <Section id="about" label="About Us" title="Built to Serve Government Agencies. Ready to Deliver.">
      <div style={{display:"grid", gridTemplateColumns:"1.05fr .95fr", gap:44, alignItems:"start"}} className="about-grid">
        <div>
          <p style={{marginBottom:16, color:"var(--text-secondary)", lineHeight:1.75}}>SAGN LLC is a Miami-Dade-based small business founded by Joanne Seepersad. We deliver dependable general services and supply chain solutions for federal, state, and local government agencies.</p>
          <p style={{marginBottom:16, color:"var(--text-secondary)", lineHeight:1.75}}>SAGN LLC supports agencies with supply sourcing, procurement fulfillment, and vendor coordination, delivering small-business agility with the professionalism government contracts require. We are ready to accept purchase orders through standard government procurement channels.</p>
          <p style={{color:"var(--text-secondary)", lineHeight:1.75}}>We are open to teaming arrangements and mentor-protégé partnerships with established prime contractors.</p>
        </div>
        <div>
          <div style={{background:"#fff", border:"1px solid var(--border)", borderTop:"3px solid var(--gold-bright)", borderRadius:"var(--radius-lg)", padding:"22px 24px"}}>
            <div style={{fontSize:".8rem", fontWeight:700, color:"var(--blue)", letterSpacing:".1em", textTransform:"uppercase", marginBottom:10}}>Delivered Work</div>
            <div style={{fontFamily:"var(--font-display)", fontSize:"1.25rem", color:"var(--navy)", lineHeight:1.25, marginBottom:8}}>Electrical Equipment — HVAC Unit</div>
            <div style={{fontSize:".94rem", color:"var(--text-secondary)", lineHeight:1.6, marginBottom:14}}>Competitively awarded by the City of Tampa and delivered in full compliance with solicitation requirements.</div>
            <div style={{display:"flex", flexWrap:"wrap", gap:"6px 20px", fontSize:".88rem", color:"var(--text-secondary)"}}>
              <span><strong style={{color:"var(--navy)"}}>City of Tampa, FL</strong></span>
              <span>Project 26-P-00467</span>
              <span>July 2026</span>
            </div>
          </div>
          <div style={{display:"flex", alignItems:"center", gap:14, marginTop:18, paddingTop:16, borderTop:"1px solid var(--border)"}}>
            <img src="./assets/sba-wosb-logo.png" alt="U.S. Small Business Administration certified Woman-Owned Small Business" style={{width:64, height:"auto", flexShrink:0}} />
            <div style={{fontSize:".88rem", color:"var(--text-secondary)", lineHeight:1.5}}>Certified by the U.S. Small Business Administration as a <strong style={{color:"var(--navy)", fontWeight:600}}>Woman-Owned Small Business</strong>.</div>
          </div>
        </div>
      </div>
    </Section>

    <Section sky id="services" label="Core Competencies" title="What We Do" desc="Focused service lines backed by hands-on experience and a reliable supplier network.">
      <div className="services-grid">{services.map((s,i) => <ServiceCard key={i} {...s} />)}</div>
      <div style={{marginTop:32, paddingTop:28, borderTop:"1px solid var(--border)"}}>
        <div style={{fontSize:".8rem", fontWeight:700, color:"var(--blue)", letterSpacing:".1em", textTransform:"uppercase", marginBottom:16}}>How We Work</div>
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(230px, 1fr))", gap:"18px 28px"}}>
          {process.map((p,i) => (
            <div key={i}>
              <div style={{fontSize:".98rem", fontWeight:700, color:"var(--navy)", marginBottom:4}}>{p.t}</div>
              <div style={{fontSize:".93rem", color:"var(--text-secondary)", lineHeight:1.55}}>{p.d}</div>
            </div>
          ))}
        </div>
      </div>
    </Section>

    <Section dark id="differentiators" label="Our Advantage" title="Why Partner with SAGN LLC" desc="SAGN LLC combines the agility and accountability of an owner-operated firm with established supplier relationships that support dependable procurement execution.">
      <div className="diff-grid">{diffs.map((d,i) => <DiffCard key={i} {...d} />)}</div>
    </Section>

    <Section sky id="past-performance" label="Past Performance" title="A Track Record of Reliability" desc="An awarded and fulfilled municipal contract, backed by thirteen years of vendor management experience.">
      <div style={{background:"#fff", border:"1px solid var(--border)", borderLeft:"3px solid var(--accent-gold)", borderRadius:"var(--radius-lg)", padding:"28px", marginBottom:32}}>
        <div style={{display:"flex", flexWrap:"wrap", gap:12, alignItems:"baseline", justifyContent:"space-between", marginBottom:6}}>
          <div style={{fontSize:".8rem", fontWeight:700, color:"var(--blue)", letterSpacing:".1em", textTransform:"uppercase"}}>Awarded Contract · City of Tampa, FL</div>
          <div style={{fontSize:".8rem", fontWeight:700, color:"var(--accent-gold)", letterSpacing:".08em", textTransform:"uppercase"}}>Fulfilled</div>
        </div>
        <h3 style={{fontFamily:"var(--font-display)", fontSize:"1.4rem", color:"var(--navy)", marginBottom:16}}>Electrical Equipment — HVAC Unit</h3>
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(150px, 1fr))", gap:20, marginBottom:20}}>
          <div><div style={{fontSize:".81rem", color:"var(--text-secondary)", textTransform:"uppercase", letterSpacing:".08em", marginBottom:3}}>Project ID</div><div style={{fontSize:"1rem", fontWeight:600, color:"var(--navy)"}}>26-P-00467</div></div>
          <div><div style={{fontSize:".81rem", color:"var(--text-secondary)", textTransform:"uppercase", letterSpacing:".08em", marginBottom:3}}>Agency</div><div style={{fontSize:"1rem", fontWeight:600, color:"var(--navy)"}}>City of Tampa, FL</div></div>
          <div><div style={{fontSize:".81rem", color:"var(--text-secondary)", textTransform:"uppercase", letterSpacing:".08em", marginBottom:3}}>Vehicle</div><div style={{fontSize:"1rem", fontWeight:600, color:"var(--navy)"}}>Request for Quotation</div></div>
          <div><div style={{fontSize:".81rem", color:"var(--text-secondary)", textTransform:"uppercase", letterSpacing:".08em", marginBottom:3}}>Awarded</div><div style={{fontSize:"1rem", fontWeight:600, color:"var(--navy)"}}>July 2026</div></div>
        </div>
        <p style={{fontSize:".99rem", color:"var(--text-secondary)", lineHeight:1.65, marginBottom:16}}>SAGN LLC was competitively awarded the contract by the City of Tampa Department of Solid Waste and Environmental Program Management as the lowest responsive bidder. The company sourced and delivered the specified HVAC unit in full compliance with the solicitation requirements.</p>        <div style={{display:"flex", flexWrap:"wrap", gap:8}}>
          <span className="naics-tag">Competitive Award</span>
          <span className="naics-tag">Equipment Sourcing</span>
          <span className="naics-tag">Municipal Client</span>
          <span className="naics-tag">Delivered Complete</span>
        </div>
      </div>
      <div style={{fontSize:".8rem", fontWeight:700, color:"var(--blue)", letterSpacing:".1em", textTransform:"uppercase", marginBottom:16}}>Owner Experience</div>
      <div style={{background:"#fff", border:"1px solid var(--border)", borderRadius:"var(--radius-lg)", padding:"28px"}}>
        <div style={{display:"flex", flexWrap:"wrap", gap:"4px 12px", alignItems:"baseline", marginBottom:14}}>
          <h3 style={{fontFamily:"var(--font-display)", fontSize:"1.25rem", color:"var(--navy)"}}>Winn-Dixie Stores, Inc.</h3>
          <div style={{fontSize:".96rem", color:"var(--text-secondary)"}}>Assistant Front-End Manager · 1997–2010</div>
        </div>
        <ul className="data-list" style={{display:"flex", flexDirection:"column", gap:4}}>
          <li>Reconciled daily cash, vendor payments, and bookkeeping across a high-volume operation</li>
          <li>Sourced and coordinated with product suppliers; tracked inventory and purchasing activity</li>
          <li>Supervised front-end staff and enforced compliance with company policy and procedures</li>
        </ul>
      </div>
    </Section>

    <Section id="company-data" label="Company Data" title="Contractor Information" desc="Everything a contracting officer needs to verify, register, and order.">
      <div className="data-grid">
        <DataCard title="Identifiers">
          <DataRow label="CAGE Code" value="125K5" />
          <DataRow label="UEI" value="KMFNA8MUCQ69" />
          <DataRow label="Entity" value="LLC — Florida" />
        </DataCard>
        <DataCard title="NAICS Codes">
          <ul className="data-list">
            <li><span className="data-naics-code">423840</span> Industrial Machinery &amp; Equipment</li>
            <li><span className="data-naics-code">423850</span> Service Establishment Equipment</li>
            <li><span className="data-naics-code">424120</span> Stationery &amp; Office Supplies</li>
          </ul>
        </DataCard>
        <DataCard title="Designations">
          <ul className="data-list">
            <li>Small Business (self-certified)</li>
            <li>Florida Registered Vendor</li>
            <li>Military Spouse-Owned (self-certified)</li>
          </ul>
        </DataCard>
        <DataCard title="How to Order">
          <p style={{fontSize:".94rem", color:"var(--text-secondary)", lineHeight:1.6}}>Email us to request a quote or submit an RFQ. Quotes are returned within 1–2 business days. GPC and micro-purchases are welcome.</p>
          <a className="btn btn-primary" href={CAPSTAT_URL} target="_blank" rel="noopener" style={{marginTop:12, fontSize:".88rem", padding:"10px 17px"}}>
            <IconDownload /> Download Capability Statement
          </a>
        </DataCard>
        <DataCard title="Service Area">
          <p style={{fontSize:".94rem", color:"var(--text-secondary)", lineHeight:1.6}}>Florida-based, shipping nationwide.</p>
          <p style={{fontSize:".89rem", color:"var(--text-light)", marginTop:8}}>Headquarters: Homestead, FL. Orders ship direct from supplier to destination.</p>
        </DataCard>
      </div>
    </Section>

    <Section id="contact" label="Get Started" title="Contact Us" desc="Ready to discuss your requirements? We respond to inquiries within one business day.">
      <div className="contact-grid">
        <div><ContactInfo /></div>
        <ContactForm onSubmit={() => toast("Opening your email app…")} />
      </div>
    </Section>

    <Footer />
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
